name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'tools/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'sw.js'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'heritage-knowledge-15.js'
      - 'assets/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成 www
        run: npm run build:web

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 修补 Android 配置
        run: npm run patch:android

      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: jiangrenshuo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: 匠人说 APK build ${{ github.run_number }}
          body: |
            自动构建的安卓安装包（debug 签名，可直接安装）。
            安装后在「我的 → 后端服务地址」里填电脑隧道地址，即可走后端问答与识别。
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
